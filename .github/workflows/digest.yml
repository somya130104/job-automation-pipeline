# Daily job-match digest.
#
# GitHub Actions cron is UTC only. 8:00 AM IST = 02:30 UTC -> "30 2 * * *".
# Actions cron can lag a few minutes under load; this job only fires an HTTP
# request, so the small drift is harmless.
#
# Secrets required (Repo Settings -> Secrets and variables -> Actions):
#   APP_ORIGIN    e.g. https://your-app.vercel.app   (no trailing slash)
#   CRON_SECRET   must match the deployed app's CRON_SECRET env var
name: daily-digest

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger digest endpoint
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/out.json -w "%{http_code}" \
            -X POST "${APP_ORIGIN%/}/api/digest/run" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            --max-time 300)
          echo "HTTP $code"
          cat /tmp/out.json
          echo
          test "$code" = "200"
        env:
          APP_ORIGIN: ${{ secrets.APP_ORIGIN }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
